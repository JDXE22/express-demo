<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="contenedor-principal">
      <section class="contenedor-interno">
        <div class="color">
            <label for="rojo">Rojo(R)</label>
            <input id="rojo" type="range" min="0" max="255" value="23" step="1"></input>
            <p id="texto-rojo"></p>
        </div>
        <div class="color">
            <label for="verde">Verde(V)</label>
            <input id="verde" type="range" min="0" max="255" value="41" step="1"></input>
            <p id="texto-verde"></p>
        </div>
        <div class="color">
            <label for="azul">Azul(A)</label>
            <input id="azul" type="range" min="0" max="255" value="56" step="1"></input>
            <p id="texto-azul"></p>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
